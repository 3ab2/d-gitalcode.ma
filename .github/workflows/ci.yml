name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: site
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      # Throwaway values for this job's own database; no project secret is used.
      DATABASE_URL: postgresql://postgres:ci@localhost:5432/site?connection_limit=2
      AUTH_SECRET: ci-only-value-not-a-secret
      AUTH_TRUST_HOST: "true"
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-only-password
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npx prisma db push --skip-generate
      - run: npm run db:seed && npm run db:seed-blog
      - run: npm run build
      - name: Smoke test
        run: |
          npm run start &
          for i in $(seq 1 30); do curl -sf http://localhost:3000/robots.txt >/dev/null && break; sleep 1; done
          npm run test:smoke
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=critical
